apiVersion: opentelemetry.io/v1alpha1
kind: OpenTelemetryCollector
metadata:
    name: simplest
    namespace: menarini
spec:
    config: |
        receivers:
          otlp:
            protocols:
              grpc:
                endpoint: 0.0.0.0:4317
              http:
                endpoint: 0.0.0.0:4318
        processors:
        
        exporters:
          debug:
           
        service:
          pipelines:
            metrics:
              receivers: [otlp]
              processors: []
              exporters: [debug]