apiVersion: apps/v1
kind: Deployment
metadata:
  name: springboot-demo
  labels:
    app: springboot-demo
    provider: menarini
    version: 0.0.5-SNAPSHOT
  annotations:
    jkube.menarini.com/tag: HEAD
  namespace: menarini
spec:
  replicas: 1
  selector:
    matchLabels:
      app: springboot-demo
      version: 0.0.5-SNAPSHOT
      matcherLabel: menariniLabel
  template:
    metadata:
      annotations:
        jkube.menarini.com/tag: HEAD
      labels:
        app: springboot-demo
        version: 0.0.5-SNAPSHOT
        matcherLabel: menariniLabel
      name: springboot-demo
      namespace: menarini
    spec:
      containers:
        - name: springboot-demo
          image: tuxtor/springboot-demo:0.0.5-SNAPSHOT
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              name: http
              protocol: TCP
          resources:
            requests:
              cpu: 200m
              memory: 512m
            limits:
              cpu: 500m
              memory: 2048m
---
apiVersion: v1
kind: Service
metadata:
  name: springboot-demo
  labels:
    app: springboot-demo
    provider: menarini
    version: 0.0.5-SNAPSHOT
  annotations:
    jkube.menarini.com/tag: HEAD
  namespace: menarini
spec:
  ports:
    - name: http
      port: 8080
      protocol: TCP
      targetPort: 8080
  selector:
    app: springboot-demo
    version: 0.0.5-SNAPSHOT
    matcherLabel: menariniLabel
---
apiVersion: autoscaling/v1
kind: HorizontalPodAutoscaler
metadata:
  name: springboot-demo
  labels:
    app: springboot-demo
    provider: menarini
    version: 0.0.5-SNAPSHOT
  namespace: menarini
spec:
  scaleTargetRef:
    kind: Deployment
    name: springboot-demo
    apiVersion: apps/v1
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 90
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: springboot-demo
  namespace: menarini
  labels:
    app: springboot-demo
    provider: menarini
    version: 0.0.5-SNAPSHOT
    release: kube-prometheus-stack
spec:
  endpoints:
    - port: http
      path: /actuator/prometheus
      interval: 5s
  selector:
    matchLabels:
      app: springboot-demo
      version: 0.0.5-SNAPSHOT
      matcherLabel: menariniLabel